{% load i18n static %}<!doctype html>
{% get_current_language as LANGUAGE_CODE %}
<html lang="{{ LANGUAGE_CODE }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}SalonFlow{% endblock %}</title>
  {# Tailwind Play CDN for now; replaced by a compiled build in M7. #}
  <script src="https://cdn.tailwindcss.com/3.4.16"></script>
  <script src="https://unpkg.com/htmx.org@2.0.4/dist/htmx.min.js" integrity="sha384-HGfztofotfshcF7+8n44JQL2oJmowVChPTg48S+jvZoztPfvwD79OC/LTtG6dMp+" crossorigin="anonymous"></script>
</head>
<body class="min-h-screen bg-stone-50 text-stone-800 antialiased">
  <main class="mx-auto max-w-2xl px-4 py-8">
    {% block content %}{% endblock %}
  </main>
</body>
</html>

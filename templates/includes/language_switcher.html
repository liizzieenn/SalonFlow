{% load i18n %}{% get_current_language as CURRENT %}{% get_available_languages as LANGS %}{% get_language_info_list for LANGS as languages %}
<form action="{% url 'set_language' %}" method="post" class="flex items-center gap-1 text-sm" aria-label="{% trans 'Language' %}">
  {% csrf_token %}
  <input type="hidden" name="next" value="{{ request.get_full_path }}">
  {% for lang in languages %}
  <button type="submit" name="language" value="{{ lang.code }}" lang="{{ lang.code }}"
          class="rounded-md px-2 py-0.5 {% if lang.code == CURRENT %}bg-stone-900 text-white{% else %}text-stone-600 hover:text-stone-900{% endif %}"
          {% if lang.code == CURRENT %}aria-current="true"{% endif %}>{{ lang.name_local }}</button>
  {% endfor %}
</form>

{% load i18n %}
<a href="{% url 'bookings:services' salon.slug %}" class="mb-4 inline-flex items-center text-sm text-stone-500 hover:text-stone-800">← {% trans "Back" %}</a>
<h2 class="mb-1 text-lg font-semibold">{% trans "Choose a specialist" %}</h2>
<p class="mb-4 text-sm text-stone-500">{{ service.name }}</p>
<ul class="grid gap-2 sm:grid-cols-2">
  <li>
    <a href="{% url 'bookings:dates' salon.slug %}?service={{ service.pk }}&staff={{ any_staff }}"
       class="block rounded-xl border border-stone-200 p-3 hover:border-rose-400">
      <span class="font-medium">{% trans "Any specialist" %}</span>
      <span class="block text-sm text-stone-500">{% trans "Earliest available" %}</span>
    </a>
  </li>
  {% for member in staff_members %}
  <li>
    <a href="{% url 'bookings:dates' salon.slug %}?service={{ service.pk }}&staff={{ member.pk }}"
       class="block rounded-xl border border-stone-200 p-3 hover:border-rose-400">
      <span class="font-medium">{{ member.full_name }}</span>
      {% if member.title %}<span class="block text-sm text-stone-500">{{ member.title }}</span>{% endif %}
    </a>
  </li>
  {% endfor %}
</ul>

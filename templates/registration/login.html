{% extends "base.html" %}
{% load i18n %}
{% block title %}{% trans "Log in" %} · SalonFlow{% endblock %}
{% block content %}
<div class="mx-auto max-w-sm rounded-2xl bg-white p-6 shadow-sm ring-1 ring-stone-200">
  <h1 class="mb-4 text-xl font-semibold">{% trans "Log in to your dashboard" %}</h1>
  {% if form.errors %}
  <p class="mb-4 rounded-lg bg-rose-50 p-3 text-sm text-rose-800" role="alert">{% trans "Wrong username or password." %}</p>
  {% endif %}
  <form method="post" class="space-y-4">
    {% csrf_token %}
    <input type="hidden" name="next" value="{{ next }}">
    <div>
      <label for="id_username" class="mb-1 block text-sm font-medium">{% trans "Username" %}</label>
      <input id="id_username" name="username" autocomplete="username" required autofocus value="{{ form.username.value|default:'' }}" class="w-full rounded-lg border border-stone-300 px-3 py-2">
    </div>
    <div>
      <label for="id_password" class="mb-1 block text-sm font-medium">{% trans "Password" %}</label>
      <input id="id_password" name="password" type="password" autocomplete="current-password" required class="w-full rounded-lg border border-stone-300 px-3 py-2">
    </div>
    <button class="w-full rounded-xl bg-rose-600 px-4 py-3 font-semibold text-white hover:bg-rose-700">{% trans "Log in" %}</button>
  </form>
</div>
{% endblock %}

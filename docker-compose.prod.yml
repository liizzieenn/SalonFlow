# Production stack: Caddy (automatic HTTPS) → gunicorn, plus Celery worker + beat,
# PostgreSQL 16 + pgvector and Redis. See docs/deploy.md.
#
#   docker compose -f docker-compose.prod.yml up -d --build
#
# Configuration comes from .env (see .env.prod.example).

x-app: &app
  build:
    context: .
    args:
      REQUIREMENTS: requirements/prod.txt
  image: salonflow:latest
  env_file: .env
  environment:
    DJANGO_SETTINGS_MODULE: config.settings.prod
    DATABASE_URL: postgres://salonflow:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@db:5432/salonflow
    REDIS_URL: redis://redis:6379/0
  restart: unless-stopped
  depends_on:
    db:
      condition: service_healthy
    redis:
      condition: service_healthy

services:
  web:
    <<: *app
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.prod
      DATABASE_URL: postgres://salonflow:${POSTGRES_PASSWORD}@db:5432/salonflow
      REDIS_URL: redis://redis:6379/0
      RUN_MIGRATIONS: "1"
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import os, urllib.request; urllib.request.urlopen(urllib.request.Request('http://localhost:8000/health/', headers={'Host': os.environ['DOMAIN']}), timeout=5)"]
      interval: 15s
      timeout: 6s
      retries: 5
      start_period: 30s

  celery:
    <<: *app
    command: celery -A config worker --loglevel=info --concurrency=2
    healthcheck:
      # A crash-looping worker would otherwise look "Up" and silently drop
      # confirmations and reminders.
      test: ["CMD-SHELL", "celery -A config inspect ping -d celery@$$HOSTNAME --timeout 5"]
      interval: 30s
      timeout: 15s
      retries: 3
      start_period: 30s

  beat:
    <<: *app
    command: celery -A config beat --loglevel=info --schedule /tmp/celerybeat-schedule

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN in .env}
      ACME_EMAIL: ${ACME_EMAIL:?set ACME_EMAIL in .env (Lets Encrypt contact address)}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    healthcheck:
      # Admin API is only bound inside the container; a crash loop fails `--wait`.
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:2019/config/"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    depends_on:
      web:
        condition: service_healthy

  db:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB: salonflow
      POSTGRES_USER: salonflow
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U salonflow -d salonflow"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
  redisdata:
  caddy_data:
  caddy_config:

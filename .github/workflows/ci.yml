name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements/*.txt
      - run: pip install ruff black
      - run: ruff check .
      - run: black --check .

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: salonflow
          POSTGRES_USER: salonflow
          POSTGRES_PASSWORD: salonflow
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U salonflow"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgres://salonflow:salonflow@localhost:5432/salonflow
      DJANGO_SETTINGS_MODULE: config.settings.test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements/*.txt
      - run: pip install -r requirements/dev.txt
      - name: Install GNU gettext (translation checks)
        run: sudo apt-get update -q && sudo apt-get install -y -q gettext
      - name: Validate Georgian catalogue
        run: msgfmt --check --statistics -o /dev/null locale/ka/LC_MESSAGES/django.po
      - name: Check for missing migrations
        run: python manage.py makemigrations --check --dry-run
      - name: Django system checks
        run: python manage.py check --fail-level WARNING
      - name: Run tests
        run: pytest --create-db --cov --cov-report=term-missing

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Build Tailwind CSS
        run: npm run build
      - name: Check the build picked up template and Python classes
        run: |
          test -s static/css/app.css
          grep -q 'bg-rose-600' static/css/app.css        # templates
          grep -q 'focus\\:ring-rose-400' static/css/app.css  # apps/bookings/forms.py

  prod-stack:
    # Builds the production image and runs the real stack (Caddy → gunicorn, Celery
    # worker + beat, Postgres, Redis) to catch what unit tests can't: missing runtime
    # dependencies, broken health checks, proxy/HTTPS settings.
    runs-on: ubuntu-latest
    needs: [lint]
    steps:
      - uses: actions/checkout@v4
      - name: Write a throwaway production .env
        run: |
          cat > .env <<ENV
          DOMAIN=localhost
          ACME_EMAIL=ci@example.com
          DJANGO_SECRET_KEY=$(openssl rand -hex 32)
          POSTGRES_PASSWORD=$(openssl rand -hex 16)
          EMAIL_BACKEND=django.core.mail.backends.console.EmailBackend
          ENV
      - name: Build and start the stack
        run: docker compose -f docker-compose.prod.yml up -d --build --wait --wait-timeout 240
      - name: Seed demo data
        run: docker compose -f docker-compose.prod.yml exec -T web python manage.py seed_demo
      - name: Smoke test over HTTPS through Caddy
        run: |
          set -euo pipefail
          k() { curl -fsSk --retry 5 --retry-all-errors --retry-delay 2 "$@"; }
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost/s/demo/book/)" = 308
          k https://localhost/health/ | grep -q '"db": true'
          k https://localhost/s/demo/book/ | grep -q 'აირჩიეთ მომსახურება'
          k https://localhost/en/s/demo/book/ | grep -q 'Choose a service'
          css=$(k https://localhost/s/demo/book/ | grep -o '/static/css/app\.[0-9a-f]*\.css')
          k -I "https://localhost$css" | grep -qi 'cache-control: max-age=315360000'
          k -I https://localhost/s/demo/book/ | grep -qi 'strict-transport-security'
      - name: Celery worker answers
        run: >
          docker compose -f docker-compose.prod.yml exec -T celery
          sh -c 'celery -A config inspect ping -d celery@$HOSTNAME --timeout 10'
      - name: Django deployment checks
        run: docker compose -f docker-compose.prod.yml exec -T web python manage.py check --deploy --fail-level ERROR
      - name: Logs on failure
        if: failure()
        run: docker compose -f docker-compose.prod.yml logs --tail 100

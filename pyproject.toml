[project]
name = "salonflow"
version = "0.1.0"
description = "Online booking + AI assistant platform for beauty salons"
requires-python = ">=3.12"

[tool.black]
line-length = 88
target-version = ["py312"]
extend-exclude = "migrations"

[tool.ruff]
line-length = 88
target-version = "py312"
extend-exclude = ["**/migrations/*"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "DJ", "SIM", "C4"]

[tool.ruff.lint.isort]
known-first-party = ["apps", "config"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.test"
python_files = ["test_*.py"]
testpaths = ["tests"]
addopts = "-ra --strict-markers --reuse-db"

[tool.coverage.run]
source = ["apps", "config"]
omit = ["*/migrations/*", "config/asgi.py", "config/wsgi.py"]
